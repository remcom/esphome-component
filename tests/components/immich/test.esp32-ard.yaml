substitutions:
  device_name: immich-esp32-ard

packages:
  base: !include ../common/esp32-ard.yaml
  immich: !include common.yaml

spi:
  id: spi_bus
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

display:
  - platform: ili9xxx
    spi_id: spi_bus
    id: immich_display
    model: ili9342
    cs_pin: GPIO5
    dc_pin: GPIO13
    reset_pin: GPIO21
    invert_colors: true
    lambda: |-
      it.image(0, 0, id(slideshow_image));
