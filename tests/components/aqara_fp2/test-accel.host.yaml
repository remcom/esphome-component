# linux-only: host I2C is only supported on Linux (script/clang-tidy.sh skips this file elsewhere).
# esphome>=2026.6.0: host I2C was added in 2026.6.0 (the min-version CI job skips this file).
# Lets clang-tidy analyse the accelerometer code, which is only compiled when `accel:` is configured.
substitutions:
  device_name: aqara-fp2-accel-host

packages:
  base: !include ../common/host.yaml
  aqara_fp2: !include common.yaml
  accel: !include accel.yaml

uart:
  id: uart_bus
  port: /dev/ttyS0
  baud_rate: 115200

i2c:
  id: i2c_bus
  device: /dev/i2c-0
