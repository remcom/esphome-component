# Radar-only configuration; the uart bus `uart_bus` comes from the platform file.
aqara_fp2:
  id: fp2
  uart_id: uart_bus
  mounting_position: left_corner
  left_right_reverse: false
  presence_sensitivity: medium
  interference_grid: |-
    . . . . . . . . . . . . . .
    . . . . . . . . . . . . . .
    . . . . . . . . . . . . . .
    . . . . . . . . . . . . . .
    . . . . . . . . . . . . . .
    . . . . . . . . . . . . . .
    . . . . . . . . . . . . . .
    . . . . . . . . . . . . . .
    . . . . . . . . . . . . . .
    . . . . . . . . . . . . . .
    . . . . . . . . . . . . . .
    . . . . . . . . . . . . . .
    . . . . . . . . . . . . . .
    . . . . . . . . . . . . . .
  zones:
    - sensitivity: high
      grid: |-
        . . X X X . . . . . . . . .
        . . X X X . . . . . . . . .
        . . X X X . . . . . . . . .
        . . . . . . . . . . . . . .
        . . . . . . . . . . . . . .
        . . . . . . . . . . . . . .
        . . . . . . . . . . . . . .
        . . . . . . . . . . . . . .
        . . . . . . . . . . . . . .
        . . . . . . . . . . . . . .
        . . . . . . . . . . . . . .
        . . . . . . . . . . . . . .
        . . . . . . . . . . . . . .
        . . . . . . . . . . . . . .

binary_sensor:
  - platform: aqara_fp2
    presence:
      name: Presence
    motion:
      name: Motion
    has_target:
      name: Has target
    zone_1:
      presence:
        name: Sofa presence
      motion:
        name: Sofa motion

sensor:
  - platform: aqara_fp2
    target_count:
      name: Target count
    radar_temperature:
      name: Radar temperature
    target_1:
      x:
        name: Target 1 X
      y:
        name: Target 1 Y
      z:
        name: Target 1 Z
      speed:
        name: Target 1 speed

text_sensor:
  - platform: aqara_fp2
    radar_version:
      name: Radar version

switch:
  - platform: aqara_fp2
    id: fp2_switches  # lets test-location-off.host.yaml override this entry
    location_report:
      name: Report targets
      restore_mode: ALWAYS_ON
