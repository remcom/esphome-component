# Bundled firmware from a local file, with every DFU automation
respeaker_lite:
  id: respeaker
  reset_pin: 4
  firmware:
    path: dummy_firmware.bin
    version: 1.1.0
    md5: 1cacd39d2680cccfccf8c3265c8d037e
    on_begin:
      - logger.log: DFU started
    on_progress:
      - logger.log:
          format: "DFU %.0f%%"
          args: [x]
    on_end:
      - logger.log: DFU done
    on_error:
      - logger.log:
          format: "DFU error %u"
          args: [x]
