substitutions:
  device_name: grid-meter-dynamic-host

packages:
  base: !include ../common/host.yaml

# Sensor values driven by the control file ($ESPHOME_TEST_CTL, see ../common/test_ctl.h) so
# tests/grid_meter/test_dynamic.py can change inputs at runtime. Defaults match common.yaml.
# Short data_timeout keeps the watchdog tests fast; L2 is configured to exercise per-phase NaN handling.
esphome:
  includes:
    - ../common/test_ctl.h

sensor:
  - platform: template
    id: power_delivered
    lambda: return test_ctl("power_import", 1234.0f);
    update_interval: 500ms
  - platform: template
    id: power_returned
    lambda: return test_ctl("power_export", 0.0f);
    update_interval: 500ms
  - platform: template
    id: voltage_l1
    lambda: return test_ctl("voltage", 230.1f);
    update_interval: 500ms
  - platform: template
    id: current_l1
    lambda: return test_ctl("current", 5.37f);
    update_interval: 500ms
  - platform: template
    id: energy_delivered_tariff1
    lambda: return test_ctl("energy_import_t1", 1000.5f);
    update_interval: 500ms
  - platform: template
    id: energy_delivered_tariff2
    lambda: return test_ctl("energy_import_t2", 2000.25f);
    update_interval: 500ms
  - platform: template
    id: energy_returned_tariff1
    lambda: return test_ctl("energy_export_t1", 300.0f);
    update_interval: 500ms
  - platform: template
    id: energy_returned_tariff2
    lambda: return test_ctl("energy_export_t2", 400.0f);
    update_interval: 500ms
  - platform: template
    id: power_delivered_l2
    lambda: return test_ctl("power_import_l2", 100.0f);
    update_interval: 500ms
  - platform: template
    id: power_returned_l2
    lambda: return test_ctl("power_export_l2", 0.0f);
    update_interval: 500ms
  - platform: template
    id: voltage_l2
    lambda: return test_ctl("voltage_l2", 231.2f);
    update_interval: 500ms
  - platform: template
    id: current_l2
    lambda: return test_ctl("current_l2", 0.43f);
    update_interval: 500ms

grid_meter:
  power_import: power_delivered
  power_export: power_returned
  voltage: voltage_l1
  current: current_l1
  energy_import_t1: energy_delivered_tariff1
  energy_import_t2: energy_delivered_tariff2
  energy_export_t1: energy_returned_tariff1
  energy_export_t2: energy_returned_tariff2
  voltage_l2: voltage_l2
  current_l2: current_l2
  power_import_l2: power_delivered_l2
  power_export_l2: power_returned_l2
  port: 5022
  data_timeout: 5s
