# =============================================================================
# ReSpeaker Lite voice satellite: device config
#
# Copy this file into your ESPHome config directory, put wifi_ssid,
# wifi_password and api_encryption_key in secrets.yaml, and install
# (ESPHome 2026.11 or newer). Everything else comes from
# respeaker-lite-base.yaml in remcom/esphome-component.
# =============================================================================

substitutions:
  name: respeaker-lite
  friendly_name: ReSpeaker Lite

packages:
  respeaker_lite: github://remcom/esphome-component/examples/respeaker_lite/respeaker-lite-base.yaml@main

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  # Uses the api encryption key
  - platform: esphome
    encryption: {}

# Optional: also send the wake word channel (XMOS channel 1) to Home Assistant
# as a second microphone, like the Voice PE does with its un-AGC'd channel.
# Here channel 1 is processed for wake words rather than raw, so check that
# speech recognition improves before keeping it.
# voice_assistant:
#   microphone:
#     - microphone: mics_16k
#       channels: 0
#     - microphone: mics_16k
#       channels: 1
